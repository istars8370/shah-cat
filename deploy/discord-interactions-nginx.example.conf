# SHAH CAT Discord Interactions public edge example
# Optional staged deployment. The Node service remains bound to 127.0.0.1:4173.
# This endpoint is server-to-server and relies on Discord Ed25519 request signatures.

limit_req_zone $binary_remote_addr zone=shah_discord_interactions:10m rate=60r/m;

server {
    listen 443 ssl http2;
    server_name discord-bot.example.com;

    # TLS directives intentionally omitted from this repository example.

    location = /api/discord/interactions {
        limit_req zone=shah_discord_interactions burst=20 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:4173/api/discord/interactions;
        proxy_set_header Host 127.0.0.1:4173;

        proxy_set_header X-Signature-Ed25519 $http_x_signature_ed25519;
        proxy_set_header X-Signature-Timestamp $http_x_signature_timestamp;
    }

    location / {
        return 404;
    }
}

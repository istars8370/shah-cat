# Standalone config. Render with scripts/render-airdrop-nginx.mjs.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    limit_req_zone $binary_remote_addr zone=shah_airdrop_submit:10m rate=20r/m;
    # Only origin-less GETs receive the fixed site Origin. Never rewrite a supplied Origin.
    map "$request_method:$http_origin" $airdrop_origin {
        default $http_origin;
        "GET:" "__ORIGIN__";
    }
    # Inspect raw URI before normalization. No static root, index or fallback.
    map $request_uri $public_path {
        default 0;
        ~^/(apply\.html|apply-ui\.js|dashboard\.css|logo\.png|api/airdrop/public/(health|status|applications))(\?.*)?$ 1;
    }
    server {
        listen __LISTEN__ ssl;
        server_name __HOST__;
        ssl_certificate "__CERT__";
        ssl_certificate_key "__KEY__";
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        if ($host != __HOST__) { return 444; }
        if ($public_path = 0) { return 404; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header Origin $airdrop_origin;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        location = /apply.html {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:4173;
        }
        location = /apply-ui.js {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:4173;
        }
        location = /dashboard.css {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:4173;
        }
        location = /logo.png {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:4173;
        }
        location = /api/airdrop/public/health {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:4173;
        }
        location = /api/airdrop/public/status {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:4173;
        }
        location = /api/airdrop/public/applications {
            limit_req zone=shah_airdrop_submit burst=5 nodelay;
            limit_req_status 429;
            limit_except POST { deny all; }
            client_max_body_size 32k;
            proxy_pass http://127.0.0.1:4173;
        }
        location / { return 404; }
    }
}

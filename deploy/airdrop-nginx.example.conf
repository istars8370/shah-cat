# SHAH CAT Genesis Airdrop public edge example
# Replace airdrop.example.com and configure TLS/certificates in the real environment.
# The Node dashboard remains bound to 127.0.0.1:4173.
# Do NOT expose /airdrop.html, /treasury.html, /api/airdrop (admin), or /api/treasury.

limit_req_zone $binary_remote_addr zone=shah_airdrop_submit:10m rate=20r/m;

server {
    listen 443 ssl http2;
    server_name airdrop.example.com;

    # TLS directives intentionally omitted from the repository example.

    location = /apply.html {
        proxy_pass http://127.0.0.1:4173/apply.html;
        proxy_set_header Host 127.0.0.1:4173;
    }

    location = /apply-ui.js {
        proxy_pass http://127.0.0.1:4173/apply-ui.js;
        proxy_set_header Host 127.0.0.1:4173;
    }

    location = /dashboard.css {
        proxy_pass http://127.0.0.1:4173/dashboard.css;
        proxy_set_header Host 127.0.0.1:4173;
    }

    location = /logo.png {
        proxy_pass http://127.0.0.1:4173/logo.png;
        proxy_set_header Host 127.0.0.1:4173;
    }

    location = /api/airdrop/public/status {
        proxy_pass http://127.0.0.1:4173/api/airdrop/public/status;
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header Origin $scheme://$host;
    }

    location = /api/airdrop/public/applications {
        limit_req zone=shah_airdrop_submit burst=5 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:4173/api/airdrop/public/applications;
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header Origin $scheme://$host;
    }

    # Fail closed for everything else.
    location / {
        return 404;
    }
}

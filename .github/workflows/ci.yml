name: SHAH CAT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shah-cat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-tests:
    name: Dashboard automated tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check dashboard server syntax
        run: node --check dashboard/server.mjs
      - name: Run all committed dashboard tests
        shell: bash
        run: |
          shopt -s nullglob
          test_files=(dashboard/*.test.mjs)
          if (( ${#test_files[@]} == 0 )); then
            echo "No committed dashboard tests found" >&2
            exit 1
          fi
          printf 'Running %s committed test files:\\n' "${#test_files[@]}"
          printf '%s\\n' "${test_files[@]}"
          node --test "${test_files[@]}"

  sdk-equivalence:
    name: Solana SDK byte equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned CI-only Solana SDK v1 and SPL Token
        run: npm install --prefix sdk-crosscheck --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Compare PDA, instructions and unsigned transaction bytes with official SDK
        run: node --test sdk-crosscheck/*.test.mjs

  devnet-missing-ata-probe:
    name: Devnet missing-ATA unsigned simulation
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/release-gate2-fee-simulation-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Confirm missing ATA and simulate without signing or broadcasting
        run: node scripts/verify_gate2b_missing_ata.mjs

  wallet-v1:
    name: SHAH Wallet 1.0 regression & safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify standalone wallet JavaScript and Node server syntax
        run: |
          node --check wallet-v1/wallet.js
          node --check wallet-v1/model.js
          node --check wallet-v1/history.mjs
          node --check wallet-v1/server.mjs
          node --check wallet-v1/multichain-registry.js
          node --check wallet-v1/multichain.mjs
          node --check wallet-v1/multichain-ui.js
      - name: Verify SHA​H Wallet 1.0 no-signing controls and public history
        run: node --test wallet-v1/*.test.mjs

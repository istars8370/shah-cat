name: SHAH CAT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shah-cat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-smoke:
    name: Read-only dashboard smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check dashboard server syntax
        run: node --check dashboard/server.mjs
      - name: Run offline smoke tests
        run: node --test dashboard/ci-smoke.test.mjs

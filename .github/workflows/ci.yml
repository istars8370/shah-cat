name: SHAH CAT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shah-cat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-tests:
    name: Dashboard automated tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check dashboard server syntax
        run: node --check dashboard/server.mjs
      - name: Run all committed dashboard tests
        shell: bash
        run: |
          shopt -s nullglob
          test_files=(dashboard/*.test.mjs)
          if (( ${#test_files[@]} == 0 )); then
            echo "No committed dashboard tests found" >&2
            exit 1
          fi
          printf 'Running %s committed test files:\\n' "${#test_files[@]}"
          printf '%s\\n' "${test_files[@]}"
          node --test "${test_files[@]}"

  public-site-preview:
    name: Public static site bundle (artifact only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build reviewed public-only files
        run: node scripts/build-public-site.mjs
      - name: Test static-public isolation
        run: node --test dashboard/public-site-build.test.mjs dashboard/site-ui.test.mjs
      - name: Upload private preview artifact (no website deployment)
        uses: actions/upload-artifact@v4
        with:
          name: shah-cat-public-preview-${{ github.run_id }}
          path: dist/public-site/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  sdk-equivalence:
    name: Solana SDK byte equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked modern Solana SDK verifier
        run: npm ci --prefix tools/sdk-modern --ignore-scripts --no-audit --no-fund
      - name: Verify ATA, instruction accounts and unsigned legacy bytes against frozen v1 SDK fixtures
        run: npm test --prefix tools/sdk-modern
      - name: Audit modern SDK dependency lockfile
        run: npm audit --prefix tools/sdk-modern --package-lock-only --audit-level=high
      - name: Reject bigint-buffer in the modern verifier
        run: node -e 'const p=require("./tools/sdk-modern/package-lock.json");if(Object.keys(p.packages).some(x=>x.endsWith("/bigint-buffer")))process.exit(1)'

  devnet-missing-ata-probe:
    name: Devnet missing-ATA unsigned simulation
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/release-gate2-fee-simulation-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Confirm missing ATA and simulate without signing or broadcasting
        run: node scripts/verify_gate2b_missing_ata.mjs

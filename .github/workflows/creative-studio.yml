name: SHAH CAT Creative Studio checks
on:
  pull_request:
    paths:
      - 'creative-studio/**'
      - 'docs/business/creative-studio-*'
      - '.github/workflows/creative-studio.yml'
  push:
    branches: [main]
    paths:
      - 'creative-studio/**'
      - '.github/workflows/creative-studio.yml'
permissions:
  contents: read
jobs:
  local-studio:
    name: Creative Studio local tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check syntax
        run: |
          node --check creative-studio/server.mjs
          node --check creative-studio/scc-ledger.mjs
          node --check creative-studio/scc-pricing.mjs
      - name: Run Studio and SCC sandbox tests without API keys or external calls
        run: node --test creative-studio/server.test.mjs creative-studio/scc-ledger.test.mjs creative-studio/scc-pricing.test.mjs creative-studio/scc-meter.integration.test.mjs

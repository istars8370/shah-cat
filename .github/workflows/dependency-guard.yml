name: SDK dependency guard

on:
  pull_request:
    paths:
      - 'sdk-crosscheck/package*.json'
      - 'tools/sdk-reference/package*.json'
      - '.github/workflows/dependency-guard.yml'
  push:
    branches: [main]
    paths:
      - 'sdk-crosscheck/package*.json'
      - 'tools/sdk-reference/package*.json'
      - '.github/workflows/dependency-guard.yml'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit ${{ matrix.directory }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        directory: [sdk-crosscheck, tools/sdk-reference]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Audit locked SDK development dependencies
        env:
          AUDIT_DIRECTORY: ${{ matrix.directory }}
        run: npm audit --prefix "$AUDIT_DIRECTORY" --package-lock-only --audit-level=high

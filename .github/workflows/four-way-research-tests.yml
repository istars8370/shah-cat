name: Four-Way research unit tests
on:
  pull_request:
    paths:
      - 'research/four-way/**'
      - '.github/workflows/four-way-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated research modules
        run: node --test research/four-way/*.test.mjs

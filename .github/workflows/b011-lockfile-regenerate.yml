name: B-011 regenerate reviewed SDK lockfiles

on:
  push:
    branches: [security/b011-lockfile-overrides-20261027]
    paths:
      - 'sdk-crosscheck/package.json'
      - 'tools/sdk-reference/package.json'
      - '.github/workflows/b011-lockfile-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'istars8370/shah-cat'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve exact overrides in locked development dependencies
        run: |
          set -euo pipefail
          npm install --prefix sdk-crosscheck --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix tools/sdk-reference --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix sdk-crosscheck --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/sdk-reference --ignore-scripts --no-audit --no-fund
          node --test sdk-crosscheck/*.test.mjs
          node tools/sdk-reference/generate.mjs --check
          node --test dashboard/sdk-reference.test.mjs
      - name: Commit reviewed-scoped lockfile changes to candidate branch
        run: |
          set -euo pipefail
          git add -- sdk-crosscheck/package-lock.json tools/sdk-reference/package-lock.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No lockfile changes generated'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'security(b011): lock verified safe transitive versions'
          git push origin HEAD:security/b011-lockfile-overrides-20261027

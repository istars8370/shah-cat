name: B-011 modern ATA and token instruction API discovery
on:
  pull_request:
    paths:
      - '.github/workflows/b011-modern-ata-byte-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Isolated modern SDK API discovery and legacy fixed-fixture context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-new"
          cd "$RUNNER_TEMP/sdk-new"
          printf '%s\n' '{"name":"shah-cat-modern-ata-probe","type":"module","private":true}' > package.json
          npm install --ignore-scripts --no-fund --no-audit --save-exact @solana/kit @solana-program/token
          SDK_ROOT="$GITHUB_WORKSPACE" node --input-type=module <<'EOF'
          import * as kit from '@solana/kit';
          import * as token from '@solana-program/token';
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const fixture=JSON.parse(readFileSync(process.env.SDK_ROOT+'/dashboard/fixtures/solana-sdk-reference.json','utf8'));
          const names=Object.keys(token).filter(k=>/associated|transferchecked|tokenaccount|pda/i.test(k));
          console.log('Modern token API candidates:',JSON.stringify(names));
          console.log('PDA/encoder API candidates:',JSON.stringify(Object.keys(kit).filter(k=>/findprogramaddress|addresstobytes|base58|instruction/i.test(k)).slice(0,100)));
          console.log('Reference ATA:',fixture.ata,'mint:',fixture.mint,'recipient:',fixture.recipient);
          assert.ok(names.length,'Modern token package must expose discoverable token APIs');
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          assert.equal(Object.keys(lock.packages).filter(k=>k.endsWith('/bigint-buffer')).length,0);
          EOF
      - name: Assert modern instruction data bytes against all six fixed SDK vectors
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdk-new"
          SDK_ROOT="$GITHUB_WORKSPACE" node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {getTransferCheckedInstructionDataEncoder,getCreateAssociatedTokenIdempotentInstructionDataEncoder} from '@solana-program/token';
          const fixture=JSON.parse(readFileSync(process.env.SDK_ROOT+'/dashboard/fixtures/solana-sdk-reference.json','utf8'));
          let checks=0;
          for(const item of fixture.cases){
            const original=item.instructions;
            const transfer=original[original.length-1];
            const actual=Buffer.from(getTransferCheckedInstructionDataEncoder().encode({amount:BigInt(item.raw),decimals:9})).toString('hex');
            assert.equal(actual,transfer.dataHex,'TransferChecked bytes at '+item.raw);
            checks++;
            if(!item.exists){
              const create=Buffer.from(getCreateAssociatedTokenIdempotentInstructionDataEncoder().encode({})).toString('hex');
              assert.equal(create,original[0].dataHex,'ATA idempotent instruction data');
              checks++;
            }
          }
          console.log('Modern instruction data byte checks:',checks,'/ expected 9');
          assert.equal(checks,9);
          EOF
      - name: Verify modern ATA PDA against all frozen owner vectors
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdk-new"
          SDK_ROOT="$GITHUB_WORKSPACE" node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {address} from '@solana/kit';
          import {findAssociatedTokenPda,TOKEN_PROGRAM_ADDRESS} from '@solana-program/token';
          const f=JSON.parse(readFileSync(process.env.SDK_ROOT+'/dashboard/fixtures/solana-sdk-reference.json','utf8'));
          let count=0;
          for(const entry of f.atas){
            const [ata]=await findAssociatedTokenPda({mint:address(f.mint),owner:address(entry.owner),tokenProgram:TOKEN_PROGRAM_ADDRESS});
            assert.equal(ata,entry.ata,'ATA PDA mismatch: '+entry.owner);
            count++;
          }
          const [recipientAta]=await findAssociatedTokenPda({mint:address(f.mint),owner:address(f.recipient),tokenProgram:TOKEN_PROGRAM_ADDRESS});
          assert.equal(recipientAta,f.ata,'primary ATA mismatch');
          console.log('Modern ATA PDA byte/address checks:',count+1,'/ expected',f.atas.length+1);
          EOF
      - name: Compare modern SPL instruction account addresses and privileges
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdk-new"
          SDK_ROOT="$GITHUB_WORKSPACE" node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {address,AccountRole} from '@solana/kit';
          import {getTransferCheckedInstruction,getCreateAssociatedTokenIdempotentInstruction} from '@solana-program/token';
          const f=JSON.parse(readFileSync(process.env.SDK_ROOT+'/dashboard/fixtures/solana-sdk-reference.json','utf8'));
          // No signing takes place. This nominal signer only contributes an address.
          const signer={address:address(f.sender),signTransactions:async()=>{throw Error('Signing forbidden in CI')}};
          let count=0;
          for(const item of f.cases){
            const original=item.instructions;
            const transfer=original[original.length-1];
            const ix=getTransferCheckedInstruction({
              source:address(f.source),mint:address(f.mint),destination:address(f.ata),
              authority:signer,amount:BigInt(item.raw),decimals:9
            });
            assert.equal(ix.programAddress,transfer.programId);
            assert.deepEqual(ix.accounts.map(a=>a.address),transfer.keys.map(k=>k.pubkey));
            assert.deepEqual(ix.accounts.map(a=>Boolean(a.role & AccountRole.WRITABLE)),transfer.keys.map(k=>k.writable));
            assert.deepEqual(ix.accounts.map(a=>a.role >= AccountRole.READONLY_SIGNER),transfer.keys.map(k=>k.signer));
            count++;
            if(!item.exists){
              const a=getCreateAssociatedTokenIdempotentInstruction({
                payer:signer,ata:address(f.ata),owner:address(f.recipient),mint:address(f.mint)
              });
              assert.equal(a.programAddress,original[0].programId);
              assert.deepEqual(a.accounts.map(x=>x.address),original[0].keys.map(x=>x.pubkey));
              assert.deepEqual(a.accounts.map(x=>Boolean(x.role & AccountRole.WRITABLE)),original[0].keys.map(x=>x.writable));
              assert.deepEqual(a.accounts.map(x=>x.role >= AccountRole.READONLY_SIGNER),original[0].keys.map(x=>x.signer));
              count++;
            }
          }
          assert.equal(count,9);
          console.log('Modern instruction account metadata checks:',count,'/9');
          EOF
      - name: Compare complete unsigned legacy message and wire bytes using modern SDK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdk-new"
          SDK_ROOT="$GITHUB_WORKSPACE" node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {address,AccountRole,createTransactionMessage,setTransactionMessageFeePayer,setTransactionMessageLifetimeUsingBlockhash,appendTransactionMessageInstructions,compileTransaction, getCompiledTransactionMessageEncoder,getTransactionEncoder} from '@solana/kit';
          import {getTransferCheckedInstruction,getCreateAssociatedTokenIdempotentInstruction} from '@solana-program/token';
          const f=JSON.parse(readFileSync(process.env.SDK_ROOT+'/dashboard/fixtures/solana-sdk-reference.json','utf8'));
          const signer={address:address(f.sender),signTransactions:async()=>{throw Error('Signing prohibited')}};
          let passed=0;
          for (const item of f.cases) {
            const instructions=[];
            if (!item.exists) instructions.push(getCreateAssociatedTokenIdempotentInstruction({payer:signer,ata:address(f.ata),owner:address(f.recipient),mint:address(f.mint)}));
            instructions.push(getTransferCheckedInstruction({source:address(f.source),mint:address(f.mint),destination:address(f.ata),authority:signer,amount:BigInt(item.raw),decimals:9}));
            const message=appendTransactionMessageInstructions(instructions,
              setTransactionMessageLifetimeUsingBlockhash({blockhash:f.blockhash,lastValidBlockHeight:0n},
                setTransactionMessageFeePayer(address(f.sender),createTransactionMessage({version:'legacy'}))));
            const compiled=compileTransaction(message);
            const messageBytes=Buffer.from(getCompiledTransactionMessageEncoder().encode(compiled.message));
            assert.equal(messageBytes.toString('base64'),item.messageBase64,'legacy message mismatch '+item.raw+' exists '+item.exists);
            passed++;
            // Legacy reference wire is one empty signature plus complete message.
            const wire=Buffer.from(getTransactionEncoder().encode(compiled));
            assert.equal(wire.toString('base64'),item.wireBase64,'unsigned wire mismatch '+item.raw+' exists '+item.exists);
            passed++;
          }
          console.log('Modern message/wire byte checks:',passed,'/ expected 12');
          EOF
      - name: Confirm current production references remain unchanged
        run: |
          npm ci --prefix sdk-crosscheck --ignore-scripts --no-audit --no-fund
          node --test sdk-crosscheck/*.test.mjs

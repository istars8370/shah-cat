name: Guardian G1 research tests

on:
  pull_request:
    paths:
      - "research/guardian-g1/**"
      - ".github/workflows/guardian-g1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/guardian-g1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        run: cargo test --locked
